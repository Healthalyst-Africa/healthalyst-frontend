name: Client CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.27.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: pnpm test-all
        # Public build configuration, matching each app's .env.example.
        # The Next.js config refuses to build without a Platform API address,
        # and HealthSchedule refuses to build without its API address.
        env:
          NEXT_PUBLIC_HEALTHALYST_PLATFORM_API_URL: /
          HEALTHALYST_PLATFORM_API_URL: https://healthalyst-platform-api-dev.onrender.com
          NEXT_PUBLIC_HEALTHALYST_HEALTH_SCHEDULE_API_URL: /health-schedule-api
          HEALTHALYST_HEALTH_SCHEDULE_API_URL: https://healthalyst-healthschedule-api-dev.onrender.com
