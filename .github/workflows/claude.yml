name: Claude

# Mention @claude in an issue, pull request comment or review to ask Claude
# to answer, or to push a fix to the pull request branch. Only the
# repository's owners, members and collaborators can trigger it, because this
# repository is public. Claude never merges; its pushes go through the same
# checks and review as anyone's.
#
# Pinned to a reviewed commit of Healthalyst-Africa/.github. To update, review
# that repository's changes, then replace the SHA and its comment.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  respond:
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    uses: Healthalyst-Africa/.github/.github/workflows/claude-mention.yml@95be9136acc233166c72a736c51ff940e8048d77 # main, 2026-11-27
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
